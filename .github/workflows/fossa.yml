name: Fossa Report Generation

on:
  workflow_dispatch:
    inputs:
      distinct_id:
  push:
    #testing phase
    branches:
      - DAT-18147

jobs:
#  fossa-scan:
#    uses: liquibase/build-logic/.github/workflows/fossa.yml@DAT-18147
#    secrets: inherit
#    with:
#      org: Datical
#
#  # https://github.com/Codex-/return-dispatch/blob/main/README.md?plain=1#L35
#  display-distinct-id:
#    runs-on: ubuntu-latest
#    steps:
#      -   name: echo distinct ID ${{ github.event.inputs.distinct_id }}
#          run: echo ${{ github.event.inputs.distinct_id }}

  wait-for-fossa-report-generation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [
            {name: "datical-service", ref: "DAT-18147",owner: "Datical"},
            {name: "DaticalDB-installer", ref: "DAT-18147",owner: "Datical"},
#            {name: "ephemeral-database", ref: "DAT-18147",owner: "liquibase"},
            {name: "drivers", ref: "DAT-18147",owner: "liquibase"},
            {name: "protoclub", ref: "DAT-18147",owner: "Datical"},
            {name: "datical-sqlparser", ref: "DAT-18147",owner: "Datical"},
            {name: "storedlogic", ref: "DAT-18147",owner: "Datical"},
            {name: "AppDBA", ref: "DAT-18147",owner: "Datical"},
            {name: "liquibase-bundle", ref: "DAT-18147",owner: "Datical"}
#            {name: "liquibase", ref: "DAT-18147",owner: "liquibase"},
            ]

    steps:
      - name: Dispatch an action and get the run ID
        uses: codex-/return-dispatch@v1
        id: return_dispatch
        continue-on-error: true
        with:
          token: ${{ secrets.FOSSA_TRIGGER_REPORT_GENERATION  }}
          ref: ${{ matrix.repo.ref }}
          repo: ${{ matrix.repo.name }}
          owner: ${{ matrix.repo.owner }}
          workflow: fossa.yml

      - name: Display run ID
        run: | 
          sleep 20
          echo ${{ steps.return_dispatch.outputs.run_id }}

      - name: Await Run ID ${{ steps.return_dispatch.outputs.run_id }}
        uses: Codex-/await-remote-run@v1
        with:
          token: ${{ secrets.FOSSA_TRIGGER_REPORT_GENERATION }}
          run_id: ${{ steps.return_dispatch.outputs.run_id }}
          run_timeout_seconds: 420 # 7 minutes Time until giving up on the run
          poll_interval_ms: 120000 # 2 minutes Frequency to poll the run for a status.


  combine-fossa-reports:
    runs-on: ubuntu-latest
    needs: wait-for-fossa-report-generation
#    needs: fossa-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.LIQUIBASEORIGIN_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.LIQUIBASEORIGIN_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Download reports from S3 and Rearrange CSV files
        run: |
          mkdir -p /home/runner/work/enterprise/fossa_reports_s3
          aws s3 cp --recursive s3://liquibaseorg-origin/enterprise_fossa_report/ /home/runner/work/enterprise/fossa_reports_s3/ 
          ls -l /home/runner/work/enterprise/fossa_reports_s3
          
          tail -n +3 /home/runner/work/enterprise/fossa_reports_s3/DaticalDB-installer.csv >> /home/runner/work/enterprise/fossa_reports_s3/DaticalDB-installer_no_header.csv
          tail -n +3 /home/runner/work/enterprise/fossa_reports_s3/drivers.csv >> /home/runner/work/enterprise/fossa_reports_s3/drivers_no_header.csv
          tail -n +3 /home/runner/work/enterprise/fossa_reports_s3/ephemeral-database.csv >> /home/runner/work/enterprise/fossa_reports_s3/ephemeral-database_no_header.csv       
          tail -n +3 /home/runner/work/enterprise/fossa_reports_s3/protoclub.csv >> /home/runner/work/enterprise/fossa_reports_s3/protoclub_no_header.csv
          tail -n +3 /home/runner/work/enterprise/fossa_reports_s3/datical-sqlparser.csv >> /home/runner/work/enterprise/fossa_reports_s3/datical-sqlparser_no_header.csv
          tail -n +3 /home/runner/work/enterprise/fossa_reports_s3/storedlogic.csv >> /home/runner/work/enterprise/fossa_reports_s3/storedlogic_no_header.csv
          tail -n +3 /home/runner/work/enterprise/fossa_reports_s3/AppDBA.csv >> /home/runner/work/enterprise/fossa_reports_s3/AppDBA_no_header.csv
          tail -n +3 /home/runner/work/enterprise/fossa_reports_s3/liquibase-bundle.csv >> /home/runner/work/enterprise/fossa_reports_s3/liquibase-bundle_no_header.csv
          tail -n +3 /home/runner/work/enterprise/fossa_reports_s3/liquibase.csv >> /home/runner/work/enterprise/fossa_reports_s3/liquibase_no_header.csv
          
          cat /home/runner/work/enterprise/fossa_reports_s3/DaticalDB-installer_no_header.csv /home/runner/work/enterprise/fossa_reports_s3/drivers_no_header.csv /home/runner/work/enterprise/fossa_reports_s3/ephemeral-database_no_header.csv /home/runner/work/enterprise/fossa_reports_s3/protoclub_no_header.csv /home/runner/work/enterprise/fossa_reports_s3/datical-sqlparser_no_header.csv /home/runner/work/enterprise/fossa_reports_s3/storedlogic_no_header.csv /home/runner/work/enterprise/fossa_reports_s3/AppDBA_no_header.csv /home/runner/work/enterprise/fossa_reports_s3/liquibase-bundle_no_header.csv /home/runner/work/enterprise/fossa_reports_s3/liquibase_no_header.csv | sort | uniq > /home/runner/work/enterprise/fossa_reports_s3/enterprise_unique.csv
          
          echo 'Provider,Version,License Type,License' | cat - /home/runner/work/enterprise/fossa_reports_s3/enterprise_unique.csv > temp && mv temp /home/runner/work/enterprise/fossa_reports_s3/enterprise_unique
          
          #Read ignored dependencies from a file
          ignoredLibsFile=$(cat ${{ github.workspace }}/.github/ignore_dependencies_fossa.txt)
          
          #Split the ignored dependencies into an array
          IFS=',' read -r -a ignoredLibs <<< "$ignoredLibsFile"
          
          tempfile=$(mktemp)
          
          grepCmd="grep -iv"
          for lib in "${ignoredLibs[@]}"; do
            grepCmd="$grepCmd -e \"$lib\""
          done
          
          #Process the FOSSA report line by line and remove the ignored dependencies
          cat /home/runner/work/enterprise/fossa_reports_s3/enterprise_unique |eval $grepCmd > enterprise_report.csv

      - name: Upload CSV to Artifacts
        uses: actions/upload-artifact@v2
        with:
          name: enterprise-report
          path: enterprise_report.csv

      - name: Upload merged CSV to S3
        run: aws s3 cp enterprise_report.csv s3://liquibaseorg-origin/enterprise_fossa_report/